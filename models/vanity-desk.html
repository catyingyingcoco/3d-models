<title>Jalico Vanity Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: full-height 3D stage, title card top-left, tool strip along the bottom */
:root {
  --bg: #e6e7e4;
  --fg: #1d2022;
  --muted: #5d6468;
  --panel: rgba(255,255,255,.78);
  --line: rgba(29,32,34,.16);
  --accent: #a9822f;
  --accent-fg: #ffffff;
  --floor: #d3bd98;
  --font: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #16181a; --fg: #eceeef; --muted: #9aa2a7;
    --panel: rgba(30,33,35,.82); --line: rgba(236,238,239,.16);
    --accent: #d8b660; --accent-fg: #1a1608; --floor: #4a4034;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #16181a; --fg: #eceeef; --muted: #9aa2a7;
  --panel: rgba(30,33,35,.82); --line: rgba(236,238,239,.16);
  --accent: #d8b660; --accent-fg: #1a1608; --floor: #4a4034;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
  display: flex; flex-direction: column; overflow: hidden;
}
#stage { position: relative; flex: 1; min-height: 0; border-radius: 10px; overflow: hidden; touch-action: none; }
canvas { display: block; width: 100%; height: 100%; }
.card {
  position: absolute; top: 10px; left: 10px; max-width: min(300px, calc(100% - 20px));
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
  backdrop-filter: blur(6px); pointer-events: none;
}
.card h1 { font-size: 15px; font-weight: 600; margin: 0 0 2px; }
.card p { margin: 0; color: var(--muted); font-size: 12.5px; line-height: 1.45; }
.card .dim { font-variant-numeric: tabular-nums; letter-spacing: .02em; color: var(--fg); }
.tools {
  position: absolute; left: 10px; right: 10px; bottom: 10px; display: flex; flex-wrap: wrap; gap: 6px 14px;
  justify-content: center; pointer-events: none;
}
.grp { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; background: var(--panel);
  border: 1px solid var(--line); border-radius: 8px; padding: 6px; pointer-events: auto; backdrop-filter: blur(6px); }
.grp span { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 0 4px; }
button {
  font: inherit; font-weight: 500; color: var(--fg); background: transparent; border: 1px solid var(--line);
  border-radius: 6px; padding: 6px 10px; cursor: pointer;
}
button:hover { border-color: var(--accent); }
button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (max-width: 520px) { .card p { display: none; } .card { padding: 8px 10px; } }
</style>

<div id="stage">
  <div class="card">
    <h1>Jalico Vanity Desk</h1>
    <p class="dim">120 × 55 × 76 cm · two drawers</p>
    <p>Click a drawer to open it. Drag items across the desktop or move the stool. Drag empty space to orbit, scroll to zoom.</p>
  </div>
  <div class="tools">
    <div class="grp"><span>Drawers</span>
      <button id="dl" aria-pressed="false">Left</button>
      <button id="dr" aria-pressed="false">Right</button>
    </div>
    <div class="grp"><span>Add</span>
      <button data-add="laptop">Laptop</button>
      <button data-add="mug">Mug</button>
      <button data-add="plant">Plant</button>
      <button data-add="book">Books</button>
    </div>
    <div class="grp">
      <button id="reset">Reset</button>
    </div>
  </div>
</div>

<script>

  sun.position.set(1.8, 3.2, 2.4);

    box(0.008, 0.09, 0.4, inner, -0.256, -0.005, 0.04, g);
    box(0.008, 0.09, 0.4, inner, 0.256, -0.005, 0.04, g);

    box(0.012, 0.012, 0.022, gold, 0.065, 0, 0.272, g);

    box(0.118, 0.004, 0.002, gold, 0, 0, 0.296, g);

  makeDrawer(-0.28625); makeDrawer(0.28625);
  var OPEN = 0.28;

  /* ---------- items ---------- */

  function mirrorItem() {

    box(0.01, 0.1, 0.012, white, -0.12, 0.055, 0, g);
    box(0.01, 0.1, 0.012, white, 0.12, 0.055, 0, g);
    var tg = new THREE.Group(); tg.position.set(0, 0.1, 0); tg.rotation.x = -0.12; g.add(tg);
    var s = rr(new THREE.Shape(), 0.23, 0.28, 0.035); s.holes.push(rr(new THREE.Path(), 0.2, 0.25, 0.02));

    fr.position.set(0, 0.06, -0.008); fr.castShadow = true; tg.add(fr);
    var rs = rr(new THREE.Shape(), 0.2, 0.25, 0.02); rs.holes.push(rr(new THREE.Path(), 0.185, 0.235, 0.015));
    var led = new THREE.Mesh(new THREE.ExtrudeGeometry(rs, { depth: 0.004, bevelEnabled: false }),

    gl.position.set(0, 0.06, -0.004); tg.add(gl);

  }

  }
  function mugItem() {
    var g = new THREE.Group(), c = M(0x2f5d50, 0.4);
    cyl(0.04, 0.036, 0.09, c, 0, 0.045, 0, g, 28);
    var h = new THREE.Mesh(new THREE.TorusGeometry(0.024, 0.006, 10, 20, Math.PI), c);
    h.position.set(0.04, 0.047, 0); h.rotation.z = -Math.PI / 2; h.castShadow = true; g.add(h);
    cyl(0.034, 0.034, 0.002, M(0x2a1a12, 0.2), 0, 0.085, 0, g, 24);
    g.userData = { drag: 'desk', half: [0.06, 0.042] };
    return g;
  }
  function plantItem() {
    var g = new THREE.Group();
    cyl(0.05, 0.038, 0.08, M(0xc9c3b8, 0.8), 0, 0.04, 0, g, 24);
    var lm = M(0x3f7a4a, 0.7);
    for (var i = 0; i < 8; i++) {
      var a = i / 8 * Math.PI * 2, leaf = new THREE.Mesh(new THREE.SphereGeometry(0.03, 12, 10), lm);
      leaf.scale.set(0.55, 2.1, 0.3);

    return g;
  }
  function bookItem() {
    var g = new THREE.Group(), cols = [0x274a6b, 0xa4472f, 0xd9c38a];
    cols.forEach(function (c, i) { box(0.22 - i * 0.015, 0.03, 0.15 - i * 0.01, M(c, 0.7), 0, 0.015 + i * 0.03, 0, g); });
    g.userData = { drag: 'desk', half: [0.11, 0.075] };

  function place(g, x, z, ry) { g.position.set(x, TOP_Y, z); g.rotation.y = ry || 0; scene.add(g); items.push(g); return g; }
  var base = [];

  seed(mirrorItem(), -0.02, -0.16, 0);
  seed(globeItem(), 0.5, -0.08, 0);

  /* ---------- stool ---------- */
  var stool = new THREE.Group(); scene.add(stool);
  (function () {
    var R = 0.17, pts = [90, 210, 330].map(function (d) { var a = d * Math.PI / 180; return new THREE.Vector2(Math.cos(a) * R, Math.sin(a) * R); });

    var seat = new THREE.Mesh(new THREE.ExtrudeGeometry(s, { depth: 0.02, bevelEnabled: false }), birch);

    [90, 210, 330].forEach(function (d) {

  }

  }

  }

  stage.addEventListener('pointerdown', function (e) {
    if (e.target !== renderer.domElement) return;

  window.addEventListener('pointermove', function (e) {

  bl.onclick = function () { toggle(drawers[0]); };
  br.onclick = function () { toggle(drawers[1]); };

  var makers = { laptop: laptopItem, mug: mugItem, plant: plantItem, book: bookItem };
  var slots = [[0.38, 0.1], [-0.38, 0.12], [0.1, 0.12], [-0.12, 0.05], [0.48, 0.12]], slotI = 0;
  document.querySelectorAll('[data-add]').forEach(function (b) {
    b.onclick = function () {
      var s = slots[slotI++ % slots.length], g = makers[b.dataset.add]();
      var h = g.userData.half;
      place(g, Math.max(-0.6 + h[0], Math.min(0.6 - h[0], s[0])), Math.max(-0.275 + h[1], Math.min(0.275 - h[1], s[1])), 0);
      extras.push(g);
    };
  });
  document.getElementById('reset').onclick = function () {
    extras.forEach(function (g) { scene.remove(g); items.splice(items.indexOf(g), 1); });
    extras.length = 0; slotI = 0;
    base.forEach(function (b) { b.g.position.set(b.x, TOP_Y, b.z); b.g.rotation.y = b.ry; });
    stool.position.set(stoolBase.x, 0, stoolBase.z); stool.rotation.y = stoolBase.ry;
    drawers.forEach(function (d) { d.target = 0; }); sync();
    camera.position.copy(home.pos); controls.target.copy(home.tgt);
  };

  /* ---------- theme + sizing + loop ---------- */
  function applyTheme() {
    var v = getComputedStyle(document.documentElement).getPropertyValue('--floor').trim();
    if (v) floorMat.color.set(v);
  }
  applyTheme();
  try { window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme); } catch (e) {}
  new MutationObserver(applyTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  function resize() {
    var w = stage.clientWidth || 800, h = stage.clientHeight || 500;
    renderer.setSize(w, h, false);
    camera.aspect = w / h; camera.fov = w / h < 0.9 ? 62 : 38; camera.updateProjectionMatrix();
  }
  new ResizeObserver(resize).observe(stage); resize();

  (function loop() {
    requestAnimationFrame(loop);
    drawers.forEach(function (d) { d.cur += (d.target - d.cur) * 0.14; d.group.position.z = d.cur; });
    controls.update();
    renderer.render(scene, camera);
  })();
})();
</script>

</body></html>
