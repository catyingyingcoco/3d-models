// ================= Jalico furniture, built from the original models =================
function rand(s){return ()=>{s=(s*16807)%2147483647;return (s-1)/2147483646;};}
function grainTex(base,line,seed,rays){
  const S=512,c=document.createElement('canvas');c.width=c.height=S;const g=c.getContext('2d'),r=rand(seed);
  g.fillStyle=base;g.fillRect(0,0,S,S);
  for(let i=0;i<80;i++){g.strokeStyle=line;g.globalAlpha=0.05+r()*0.14;g.lineWidth=0.6+r()*1.8;
    const x0=r()*S,amp=3+r()*10,f=0.004+r()*0.01,ph=r()*6;
    g.beginPath();for(let y=0;y<=S;y+=8){const x=x0+Math.sin(y*f+ph)*amp;y?g.lineTo(x,y):g.moveTo(x,y)}g.stroke();}
  for(let i=0;i<(rays||0);i++){g.globalAlpha=0.1+r()*0.15;g.fillStyle='#E2CBA6';g.beginPath();g.ellipse(r()*S,r()*S,2,6+r()*12,0,0,7);g.fill();}
  g.globalAlpha=1;const t=new THREE.CanvasTexture(c);t.anisotropy=4;return t;
}

const FM={
  jWood:std({map:grainTex('#E6C9A2','#B98A5A',7)}), jDoor:std({map:grainTex('#E9CDA7','#B5845A',3),roughness:0.55}),
  jInner:std({map:grainTex('#E2C59E','#A87C52',11),roughness:0.7}),
  birch:std({map:grainTex('#D2B48A','#957049',21),roughness:0.62}),
  pine:std({map:grainTex('#e2c084','#b48f55',5),roughness:0.62}), white:std({color:0xf3f2ee,roughness:0.55}),
  black:std({color:0x1d1b1a,roughness:0.4,metalness:0.4}), steel:std({color:0xbfc3c6,roughness:0.3,metalness:0.8}),
  rod:std({color:0xf2f2f0,roughness:0.4}), cushion:std({color:0xF1E9DA,roughness:0.95}),
  walnut:std({color:0x8A5634,roughness:0.5}), plastic:std({color:0xC9CFD3,roughness:0.45}), litter:std({color:0x4A2E18,roughness:1}),
};
const mcache={};function mc(hex){return mcache[hex]||(mcache[hex]=std({color:hex,roughness:0.85}));}

function mk(geo,mat,x,y,z,p){const o=new THREE.Mesh(geo,mat);o.position.set(x,y,z);o.castShadow=o.receiveShadow=true;p.add(o);return o}

const B3=(w,h,d)=>new THREE.BoxGeometry(w,h,d);
const CY=(r,h,x)=>{const g=new THREE.CylinderGeometry(r,r,h,18);if(x)g.rotateZ(Math.PI/2);return g};
const furnDoors=[]; // {g, target, prop:'ry'|'pz'}

// small props (cm, bottom at y=0, front +z)
function coatM(col,len,kind){const g=new THREE.Group(),m=mc(col),d=kind==='puffer'?18:14,wB=kind==='coatLong'?36:31;
  mk(taper(26,wB,len,d),m,0,len/2,0,g);const sl=len*0.75;

  mk(B3(15,7,d*0.7),m,0,len+2,-d*0.1,g);
  if(kind==='puffer')for(let y=8;y<len-4;y+=11)mk(B3(wB+(26-wB)*y/len+1.5,2.4,d+1.2),mc(0x111111),0,y,0,g);
  return g}
function slippersM(col){const g=new THREE.Group(),m=mc(col);[-5.5,5.5].forEach(x=>{mk(B3(9,2.5,25),m,x,1.25,0,g);mk(B3(9.6,4,9),m,x,4,5,g)});return g}
function sneakersM(col){const g=new THREE.Group(),m=mc(col),w=mc(0xF2F0EC);[-5.8,5.8].forEach(x=>{mk(B3(9.5,3,27),w,x,1.5,0,g);mk(taper(8,9,7.5,21),m,x,6.75,-2.5,g)});return g}

  const b=mk(new THREE.SphereGeometry(1,22,14),w,0,8.5,0,g);b.scale.set(10,8.5,15);
  mk(new THREE.SphereGeometry(6.5,20,14),w,0,15,13,g);

  [[3,15.5,-3,5,2.2,6,o],[-4.5,14.5,5,4,2.2,4.5,k],[-2.5,19.8,13.5,3.5,2.2,3.2,o],[5,9,-9,3,4,4,k]].forEach(([x,y,z,a,bb,c,mm])=>{const p=mk(new THREE.SphereGeometry(1,14,10),mm,x,y,z,g);p.scale.set(a,bb,c)});
  [-2.3,2.3].forEach(x=>mk(new THREE.SphereGeometry(0.8,8,6),k,x,16,19,g));
  const t=mk(new THREE.TorusGeometry(8,1.4,8,18,Math.PI),o,0,1.4,-2,g);t.rotation.x=-Math.PI/2;t.rotation.z=Math.PI/2;
  return g}

// ---- 1. Jalico double-sided entry cabinet (cm). x=0 at the side wall, z=0 at the shared middle, B face toward the front door ----
function buildEntry(){
  const root=new THREE.Group(),Tc=1.8,EW=110,EH=215,dA=35,dB=35,L=120,tw=36;
  let face='A';
  function door(p,xh,y,z,w,h,side,handle){
    const g=new THREE.Group();g.position.set(xh,0,z);p.add(g);
    cb(g,side>0?0:-w,y,0,w,h,Tc,FM.jDoor);
    [0.1,0.5,0.9].forEach(f=>cb(g,side>0?1:-4,y+h*f-2,-1.2,3,4,1.2,FM.steel));
    if(handle){const hx=side>0?w-5:-w+4;cb(g,hx,handle.y,Tc,1,handle.len,1.2,FM.black);}
    const atWall=(face==='A'&&xh===0)||(face==='B'&&xh===EW);
    furnDoors.push({g,target:-side*(atWall?1.5:1.92),prop:'ry'});
  }
  function hookRail(p,x,y,z,len,n){cb(p,x,y,z,len,2.5,0.6,FM.black);

  // A face (toward the family room)
  const a=new THREE.Group();root.add(a);face='A';
  { const Dc=dA,dx=tw;

    cb(a,Tc,EH-Tc,0,EW-2*Tc,Tc,Dc,FM.jWood);cb(a,Tc,6,0,EW-2*Tc,Tc,Dc,FM.jInner);cb(a,Tc,0,Dc-3,EW-2*Tc,6,Tc,FM.jWood);
    cb(a,dx,6+Tc,0,Tc,EH-6-2*Tc,Dc,FM.jWood);cb(a,Tc,EH-55,0,dx-Tc,Tc,Dc,FM.jInner);
    const rx=dx+Tc,rw=EW-Tc-rx;
    cb(a,rx,EH-30,0,rw,Tc,Dc,FM.jInner);cb(a,rx,EH-56,0,rw,20,Tc,FM.jInner);hookRail(a,rx+rw*0.2,EH-46,Tc,rw*0.6,6);

    const d1=dx+Tc/2,gap=0.3,wR=(EW-d1)/2;

    door(a,EW,0.5,Dc,wR-gap*1.5,EH-0.5,-1,{y:EH*0.5,len:16});
    const v=vacM();v.position.set((Tc+dx)/2,6+Tc,Dc/2);a.add(v);
    hang(a,coatM(0xCDB497,100,'coatLong'),52,EH-46,100,12);hang(a,coatM(0x222222,85,'puffer'),76,EH-46,85,15);hang(a,coatM(0x2E3A55,68,'jacket'),98,EH-46,68,12);

  }
  // B face (toward the front door), mirrored onto the other side
  const b=new THREE.Group();b.rotation.y=Math.PI;b.position.set(EW,0,0);root.add(b);face='B';
  { const Dc=dB,ww=EW-tw,gap=0.3;

    cb(b,Tc,EH-30,0,ww-2*Tc,Tc,Dc,FM.jInner);cb(b,Tc,EH-56,0,ww-2*Tc,20,Tc,FM.jInner);hookRail(b,ww*0.18,EH-46,Tc,ww*0.64,7);

    // side tower over the bench

// ---- 2. Jalico cat litter cabinet (mm). Centre bottom at origin, front +z, cat door on the +x side ----
function buildLitter(){
  const root=new THREE.Group(),Tm=18,LW=500,LD=480,LH=700,plinth=60,shelfY=400,ov=10,bodyTop=LH-Tm,P2=Math.PI/2;
  function rrect(p,x,y,w,h,r){p.moveTo(x+r,y);p.lineTo(x+w-r,y);p.quadraticCurveTo(x+w,y,x+w,y+r);p.lineTo(x+w,y+h-r);p.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    p.lineTo(x+r,y+h);p.quadraticCurveTo(x,y+h,x,y+h-r);p.lineTo(x,y+r);p.quadraticCurveTo(x,y,x+r,y);}
  function panel(w,h,holes,mat,shape){let s=shape;if(!s){s=new THREE.Shape();s.moveTo(0,0);s.lineTo(w,0);s.lineTo(w,h);s.lineTo(0,h);s.lineTo(0,0);}
    (holes||[]).forEach(fn=>{const p=new THREE.Path();fn(p);s.holes.push(p);});
    const m=new THREE.Mesh(new THREE.ExtrudeGeometry(s,{depth:Tm,bevelEnabled:false,curveSegments:12}),mat||FM.birch);m.castShadow=m.receiveShadow=true;return m;}
  const place=(m,x,y,z,rx,ry)=>{m.position.set(x,y,z);m.rotation.set(rx||0,ry||0,0);root.add(m);return m;};
  place(panel(LD,bodyTop),-LW/2,0,LD/2,0,P2);
  const hole={x:45,y:110,w:LD-45-Tm-50,h:240,r:42};
  place(panel(LD,bodyTop,[p=>rrect(p,hole.x,hole.y,hole.w,hole.h,hole.r)]),LW/2-Tm,0,LD/2,0,P2);
  place(panel(LW-2*Tm,bodyTop),-LW/2+Tm,0,-LD/2);
  place(panel(LW+2*ov,LD+ov),-LW/2-ov,LH-Tm,LD/2+ov,-P2);
  place(panel(LW-2*Tm,LD-Tm-12),-LW/2+Tm,plinth,LD/2-12,-P2);
  place(panel(LW-2*Tm,LD-Tm-12),-LW/2+Tm,shelfY,LD/2-12,-P2);
  place(panel(LW-2*Tm,plinth),-LW/2+Tm,0,LD/2-30-Tm);
  // refill lid outline + black barrel bolt on top
  const lid=new THREE.Mesh(B3(320,2,240),std({color:0x8c6d4c,roughness:.7}));lid.position.set(0,LH+1,ov/2);root.add(lid);
  mk(B3(26,18,66),FM.black,0,LH+9,ov/2+70,root);
  // litter store: front board with viewing window, litter visible inside, walnut pull handle
  const chY=shelfY+Tm,chH=bodyTop-chY,cw=LW-2*Tm,zFront=LD/2-45-Tm;
  place(panel(cw,chH,[p=>rrect(p,(cw-86)/2,78,86,chH-108,6),p=>rrect(p,(cw-150)/2,27,150,24,12)]),-cw/2,chY,zFront);
  mk(B3(cw-4,150,zFront+LD/2-Tm-4),FM.litter,0,chY+60+75,(zFront-LD/2+Tm)/2,root);
  const py=chY+39,rodZ=zFront+Tm+10+22;
  mk(B3(176,30,10),FM.birch,0,py,zFront+Tm+5,root);
  for(const sx of [-52,52]){mk(CY(5,22),FM.black,sx,py,rodZ-11,root).rotation.x=P2;}
  mk(CY(8.5,150,true),FM.walnut,0,py,rodZ,root);
  // grey litter box on the cabinet floor
  const bx=400,bz=300,bh=150,y0=plinth+Tm,cz=LD/2-70-bz/2;
  mk(B3(bx,5,bz),FM.plastic,0,y0+2.5,cz,root);
  mk(B3(bx,bh,5),FM.plastic,0,y0+bh/2,cz-bz/2,root);mk(B3(bx,bh,5),FM.plastic,0,y0+bh/2,cz+bz/2,root);
  mk(B3(5,bh,bz),FM.plastic,-bx/2,y0+bh/2,cz,root);mk(B3(5,bh,bz),FM.plastic,bx/2,y0+bh/2,cz,root);
  mk(B3(bx-10,40,bz-10),FM.litter,0,y0+25,cz,root);
  // left-hinged door with finger notch
  const db=plinth+Tm/2,dh=bodyTop-db,n=Math.round(bodyTop*0.71)-db,ds=new THREE.Shape();
  ds.moveTo(0,0);ds.lineTo(LW,0);ds.lineTo(LW,n-45);ds.quadraticCurveTo(LW,n-28,LW-14,n-22);ds.quadraticCurveTo(LW-26,n-17,LW-26,n);
  ds.lineTo(LW-26,n+40);ds.quadraticCurveTo(LW-26,n+56,LW-14,n+61);ds.quadraticCurveTo(LW,n+67,LW,n+84);ds.lineTo(LW,dh);ds.lineTo(0,dh);ds.lineTo(0,0);
  const pivot=new THREE.Group();pivot.position.set(-LW/2,db,LD/2);root.add(pivot);
  pivot.add(panel(0,0,null,FM.birch,ds));
  furnDoors.push({g:pivot,target:-100*Math.PI/180,prop:'ry'});
  return root;
}

// ---- 3. Quarter-round corner shelf (cm). Corner at origin, open arc toward +x/+z ----
function buildCorner(){
  const root=new THREE.Group(),SH=180,R=45,Tc=1.8;
  const add=m=>{m.castShadow=m.receiveShadow=true;root.add(m);return m;};
  const s=new THREE.Shape();s.moveTo(0,0);s.lineTo(R,0);s.lineTo(R,Tc);s.lineTo(Tc,Tc);s.lineTo(Tc,R);s.lineTo(0,R);s.lineTo(0,0);
  const bg=new THREE.ExtrudeGeometry(s,{depth:SH,bevelEnabled:false});bg.rotateX(Math.PI/2);add(new THREE.Mesh(bg,FM.white)).position.y=SH;
  function quarter(radius,thick,mat,level,inset){const sh=new THREE.Shape(),d=inset||0;
    if(d){const a0=Math.asin(d/radius),a1=Math.PI/2-a0,ex=Math.sqrt(radius*radius-d*d);sh.moveTo(d,d);sh.lineTo(ex,d);sh.absarc(0,0,radius,a0,a1,false);sh.lineTo(d,d);}
    else{sh.moveTo(0,0);sh.lineTo(radius,0);sh.absarc(0,0,radius,0,Math.PI/2,false);sh.lineTo(0,0);}
    const g=new THREE.ExtrudeGeometry(sh,{depth:thick,bevelEnabled:false,curveSegments:48});g.rotateX(Math.PI/2);
    add(new THREE.Mesh(g,mat)).position.y=level;}
  quarter(R+0.6,Tc,FM.white,SH);quarter(R,Tc,FM.white,9);quarter(R-3,9-Tc,FM.white,9-Tc);
  quarter(R-1.2,Tc,FM.pine,68,Tc+0.3);quarter(R-1.2,Tc,FM.pine,122,Tc+0.3);
  return root;
}

// place in the house (metres): scale converts cm/mm to m
const furniture=[
  {id:'entry',tag:'JALICO',name:'玄關衣帽櫃',dims:'110 × 215 cm · 連鞋凳深 157 cm',where:'Family Room 大門口',
   obj:buildEntry(),scale:0.01,pos:[0.07,0,2.6],ry:0,focus:[0.55,1.0,2.1],cam:[2.6,2.0,-1.6]},
  {id:'litter',tag:'JALICO',name:'貓砂櫃',dims:'50 × 48 × 70 cm',where:'廁所 2，貓門向住廁所門口',
   obj:buildLitter(),scale:0.001,pos:[9.5+0.06+0.25,0,7.05],ry:Math.PI/2,focus:[9.85,0.35,7.0],cam:[1.6,1.2,-1.4]},
  {id:'corner',tag:'JALICO',name:'角落層架',dims:'半徑 45 × 高 180 cm',where:'飯廳前窗角落',
   obj:buildCorner(),scale:0.01,pos:[10-0.065,0,0.065],ry:-Math.PI/2,focus:[9.75,0.9,0.3],cam:[-2.0,1.3,2.2]},
];
furniture.forEach(f=>{f.obj.scale.setScalar(f.scale);f.obj.position.set(...f.pos);f.obj.rotation.y=f.ry;house.add(f.obj);});

// labels
const labels=[];
function label(r){
  const cv=document.createElement('canvas'); cv.width=512; cv.height=128;
  const g=cv.getContext('2d');
  g.font='700 54px "Noto Sans HK","PingFang HK",sans-serif';
  const tw=g.measureText(r.name).width+48;
  const x0=(512-tw)/2; g.fillStyle='rgba(255,255,255,0.92)'; g.beginPath(); g.roundRect?g.roundRect(x0,20,tw,88,18):g.rect(x0,20,tw,88); g.fill();
  g.fillStyle='#22281f'; g.textAlign='center'; g.textBaseline='middle'; g.fillText(r.name,256,66);
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(cv),depthTest:false,transparent:true}));
  s.scale.set(3.2,0.8,1); s.position.set((r.x0+r.x1)/2,H+0.6,(r.z0+r.z1)/2); s.renderOrder=10;
  house.add(s); labels.push(s); r.label=s;
}
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(()=>rooms.filter(r=>r.id!=='hall').forEach(label));

// camera
let fly=null;
const v3=a=>new THREE.Vector3(a[0]-W/2,a[1],a[2]-D/2);
function flyTo(pos,target){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){camera.position.copy(pos);controls.target.copy(target);controls.update();return;}
  fly={p0:camera.position.clone(),t0:controls.target.clone(),p1:pos,t1:target,start:performance.now()};
}
function preset(top){ fly=null;
  if(top){ camera.position.set(0.01,24,0.01); } else { camera.position.set(11,13,15); }
  controls.target.set(0,0,0); controls.update();
}
preset(false);

function resize(){
  const w=canvas.clientWidth,h=canvas.clientHeight; if(!w||!h) return;
  renderer.setSize(w,h,false); camera.aspect=w/h;
  camera.fov=w<520?55:42; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(canvas); resize();

// room selection
let sel=null;
const accent=new THREE.Color(0x2f6b4f);
function select(id){
  sel = sel===id?null:id;
  rooms.forEach(r=>{ r.mesh.material.color.copy(r.base); if(r.label) r.label.material.opacity = sel && r.id!==sel ? 0.35 : 1; });
  document.querySelectorAll('tr.room').forEach(tr=>tr.classList.toggle('on',tr.dataset.id===sel));
}
const rows=document.getElementById('rows'); let tot=0;
rooms.forEach(r=>{
  const w=r.x1-r.x0,d=r.z1-r.z0,a=w*d; tot+=a;
  const tr=document.createElement('tr'); tr.className='room'; tr.dataset.id=r.id; tr.tabIndex=0;
  tr.innerHTML=`<td><span class="sw" style="background:#${r.c.toString(16)}"></span>${r.name}</td><td class="n">${w} × ${d}</td><td class="n">${a.toFixed(1)}</td><td class="n">${Math.round(a*10.764)}</td>`;
  tr.addEventListener('click',()=>select(r.id));
  tr.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(r.id);}});
  rows.appendChild(tr);
});
document.getElementById('tm').textContent=tot.toFixed(1);
document.getElementById('tf').textContent=Math.round(tot*10.764).toLocaleString();

// tools
const wb=document.getElementById('walls');
function setLow(low){wb.setAttribute('aria-pressed',low);wallGroup.scale.y=low?0.35:1;labels.forEach(s=>s.position.y=low?2.6:H+0.6);}
wb.addEventListener('click',()=>setLow(wb.getAttribute('aria-pressed')!=='true'));
let doorsOpen=false;const dbtn=document.getElementById('doors');
function setDoors(o){doorsOpen=o;dbtn.setAttribute('aria-pressed',o);dbtn.textContent=o?'閂返櫃門':'打開櫃門';}
dbtn.addEventListener('click',()=>setDoors(!doorsOpen));
document.getElementById('top').addEventListener('click',()=>{setFurn(null);preset(true);});
document.getElementById('reset').addEventListener('click',()=>{setFurn(null);preset(false);});

// furniture cards
const furnEl=document.getElementById('furn');let fsel=null;
function setFurn(id){fsel=id;furnEl.querySelectorAll('.fcard').forEach(b=>b.setAttribute('aria-pressed',b.dataset.id===id));}
furniture.forEach(f=>{
  const b=document.createElement('button');b.className='fcard';b.dataset.id=f.id;b.setAttribute('aria-pressed','false');
  b.innerHTML=`<span class="tag">${f.tag}</span><b>${f.name}</b><span class="d">${f.dims}</span><span class="d">${f.where}</span>`;
  b.addEventListener('click',()=>{setFurn(f.id);setLow(true);const t=v3(f.focus);flyTo(t.clone().add(new THREE.Vector3(...f.cam)),t);});
  furnEl.appendChild(b);
});

// tap a floor in the model
const ray=new THREE.Raycaster(), ptr=new THREE.Vector2(); let down=null;
canvas.addEventListener('pointerdown',e=>{down=[e.clientX,e.clientY];fly=null;});
canvas.addEventListener('pointerup',e=>{
  if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>6) return;
  const b=canvas.getBoundingClientRect();
  ptr.set((e.clientX-b.left)/b.width*2-1,-(e.clientY-b.top)/b.height*2+1);
  ray.setFromCamera(ptr,camera);
  const hit=ray.intersectObjects(rooms.map(r=>r.mesh))[0];
  if(hit){ const r=rooms.find(r=>r.mesh===hit.object); select(r.id); }
});

const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
let t=0;
(function loop(now){
  requestAnimationFrame(loop); t+=0.05;
  if(fly){const k=Math.min(1,(now-fly.start)/900),e=1-Math.pow(1-k,3);
    camera.position.lerpVectors(fly.p0,fly.p1,e);controls.target.lerpVectors(fly.t0,fly.t1,e);if(k>=1)fly=null;}
  const kk=still?1:0.1;
  furnDoors.forEach(d=>{const tg=doorsOpen?d.target:0;
    if(d.prop==='ry')d.g.rotation.y+=(tg-d.g.rotation.y)*kk;else d.g.position.x+=(tg-d.g.position.x)*kk;});
  if(sel){ const r=rooms.find(r=>r.id===sel); const k=still?0.5:0.4+0.25*Math.sin(t); r.mesh.material.color.copy(r.base).lerp(accent,k); }
  controls.update(); renderer.render(scene,camera);
})(performance.now());
})();
